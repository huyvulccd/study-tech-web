<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ôn tập phỏng vấn</title>
<link rel="stylesheet" href="styles.css">
<script src="content/study-content.js" defer></script><script src="content/kafka.js" defer></script><script src="content/kafka-lessons.js" defer></script><script src="content/kafka-project.js" defer></script>
<script src="content/redis.js" defer></script><script src="content/redis-project.js" defer></script><script src="content/database.js" defer></script><script src="content/database-project.js" defer></script><script src="content/patterns.js" defer></script><script src="content/patterns-project.js" defer></script>

<body>
<header class="site-header"><a href="index.html">Sổ tay của tôi</a><span>Học & ghi chép</span></header>
<main class="notebook">
<section aria-labelledby="section-title">
<div class="section-heading"><h2 id="section-title">Chủ đề học Kafka</h2><span id="question-total"></span></div>
<div class="topic-links" aria-label="Chủ đề"></div>
<section id="study-guide" class="study-guide" aria-label="Khung ôn tập"></section>
<div class="tools"><label class="search"><span aria-hidden="true">⌕</span><input type="search" id="search-input" placeholder="Tìm kiến thức, câu hỏi, dự án…" aria-label="Tìm kiến thức, câu hỏi hoặc dự án"></label><label class="saved-filter"><input type="checkbox" id="only-saved"> Chỉ câu đã lưu <span id="saved-count"></span></label></div>
<div id="kind-filters" class="kind-filters" aria-label="Loại câu hỏi"><button data-kind="all" class="active">Tất cả</button><button data-kind="theory">Lý thuyết</button><button data-kind="scenario">Xử lý tình huống</button></div>
<p id="results-status" class="results-status" role="status"></p>
<div id="question-list"></div>
<details id="project-section" class="learning-topic project-section" hidden></details>
<p id="note-status" role="status"></p>
</section>
<footer>Nội dung tập trung cho phỏng vấn Backend Middle / Middle+.</footer>
</main>
<dialog id="debate-dialog" aria-labelledby="debate-title"><div class="debate-dialog-heading"><h2 id="debate-title">Sao chép nội dung debate</h2><button type="button" data-debate-close>Đóng</button></div><p>Nhấn Ctrl+C hoặc Cmd+C để sao chép nội dung đang chọn, rồi dán vào công cụ AI bạn muốn dùng.</p><label for="debate-prompt">Nội dung mục học và prompt debate</label><textarea id="debate-prompt" readonly rows="14"></textarea><button type="button" data-debate-select>Chọn toàn bộ</button></dialog>
